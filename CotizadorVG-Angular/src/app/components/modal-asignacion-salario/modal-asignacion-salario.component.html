<!-- ===== MODAL: Asignar por rango de valor asegurado (subgrupos) ===== -->
<div id="modalAsignacionSalario" class="modal" [style.display]="plan.modalAsignacionSalarioVisible ? 'flex' : 'none'">
    <div class="modal-content" style="max-width:640px;">
        <div class="modal-header">
            <h3>Asignaci&oacute;n por rango de valor asegurado</h3>
            <button class="btn-close" type="button" (click)="plan.cerrarModalAsignacionSalario()">&times;</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--color-gray);margin-bottom:14px;font-size:14px;">
                Define qu&eacute; subgrupo corresponde a cada rango de valor asegurado. Los asegurados sin subgrupo ser&aacute;n asignados autom&aacute;ticamente.
            </p>
            <table class="table-editable" id="tablaAsignacionSal">
                <thead>
                    <tr>
                        <th>Rango de valor asegurado (COP)</th>
                        <th>Subgrupo</th>
                    </tr>
                </thead>
                <tbody id="tbody-asig-sal">
                    @for (fila of plan.filasAsignacionSalario; track $index) {
                        <tr>
                            <td style="font-size:13px;padding:8px;">{{ fila.label }}</td>
                            <td>
                                <select class="filter-select" style="width:100%;" [(ngModel)]="fila.subgrupoId">
                                    <option value="">-- Sin asignar --</option>
                                    @for (sg of subgrupos; track sg.id) {
                                        <option [value]="sg.id">{{ sg['nombre'] }} ({{ sg.id }})</option>
                                    }
                                </select>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn btn-accent" type="button" (click)="plan.ejecutarAsignacionPorSalario()">Aplicar asignaci&oacute;n</button>
            <button class="btn btn-secondary" type="button" (click)="plan.cerrarModalAsignacionSalario()">Cancelar</button>
        </div>
    </div>
</div>
