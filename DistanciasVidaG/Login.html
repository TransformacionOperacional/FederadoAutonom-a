<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Tablero Vida Grupo</title>
    <link rel="icon" type="image/x-icon" href="https://sucursal.segurossura.com.co/favicon.ico">
    <style>
        :root { --blue: #2D6DF6; --aqua: #00aaec; --ink: #172033; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at 12% 10%, rgba(0,170,236,.26), transparent 28%), linear-gradient(135deg, #eef5ff, #c8d9f2); }
        .login-card { width: min(100%, 430px); padding: 42px; border-radius: 20px; background: #fff; box-shadow: 0 20px 45px rgba(0, 51, 160, .18); }
        .brand { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 28px; }
        .brand img { width: 110px; height: auto; }
        h1 { margin: 0 0 8px; color: var(--blue); font-size: 1.8rem; text-align: center;}
        .description { margin: 0 0 28px; color: #5c6573; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; color: #283854; font-weight: 700; font-size: .92rem; }
        input { width: 100%; padding: 13px 14px; border: 1px solid #c9d5e5; border-radius: 9px; font: inherit; outline: none; }
        input:focus { border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(0,170,236,.14); }
        input.campo-invalido { border-color: #d83b46; }
        button { width: 100%; margin-top: 27px; padding: 14px; border: 0; border-radius: 9px; color: #fff; background: var(--blue); font: inherit; font-weight: 700; cursor: pointer; }
        button:hover:not(:disabled) { background: #1f5ad6; }
        button:disabled { cursor: wait; opacity: .7; }
        .btn-permisos { display: block; width: 100%; margin-top: 12px; padding: 13px; border: 1px solid var(--blue); border-radius: 9px; color: var(--blue); background: #fff; font-weight: 700; text-align: center; text-decoration: none; }
        .btn-permisos:hover { background: #dfeaff; }
        .message { min-height: 22px; margin: 16px 0 0; color: #c62835; font-size: .9rem; text-align: center; }
        .loading { display: none; margin-top: 15px; color: #406080; font-size: .88rem; text-align: center; }
        .loading.show { display: block; }
        @media (max-width: 460px) { .login-card { padding: 30px 24px; } }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <img src="logo-sura-azul-nuevo.png" alt="SURA">
        </div>
        <h1>Tablero de suscripción Vida Grupo</h1>
        <form id="formulario">
            <label for="Correo">Correo electrónico</label>
            <input id="Correo" type="email" autocomplete="username" required>
            <label for="Clave">Contraseña</label>
            <input id="Clave" type="password" autocomplete="current-password" required>
            <button id="login-button" type="submit">Iniciar sesión</button>
            <a class="btn-permisos" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=_tQLPBERE02ODHwzuet1gVRVQwqrmS9JpIXrln2IQlJURUNNU1Y2VEEyU00wVkVGTzhNVDhIU1ZXWi4u" target="_blank" rel="noopener noreferrer">Solicitar permisos</a>
            <p class="message" id="respuesta" role="alert"></p>
            <p class="loading" id="pantallaCarga">Validando credenciales…</p>
        </form>
    </main>
    <script src="assets/js/login.js"></script>
</body>
</html>
